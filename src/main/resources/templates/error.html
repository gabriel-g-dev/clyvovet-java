<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ClyvoVet — Não foi possível continuar</title><link rel="stylesheet" th:href="@{/css/clyvovet.css}">    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body><main id="conteudo" class="container login-caixa"><div class="painel"><div class="painel-corpo">
    <p class="sobretitulo" th:text="'Erro ' + ${status}">Erro</p>
    <h1 th:text="${status == 404} ? 'Página não encontrada' : 'Não foi possível continuar'">Não foi possível continuar</h1>
    <p class="subtitulo" th:text="${status == 404} ? 'O endereço pode ter mudado ou o registro não está mais disponível.' : 'Tente abrir a página novamente. Se o problema continuar, informe a equipe da clínica.'">Tente abrir a página novamente.</p>
    <a class="btn" th:href="@{/dashboard}">Voltar para o painel</a>
</div></div></main></body>
</html>
