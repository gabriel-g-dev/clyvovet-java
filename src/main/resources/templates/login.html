<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClyvoVet — Entrar</title>
    <link rel="stylesheet" th:href="@{/css/clyvovet.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body>

<main id="conteudo" class="container login-caixa">

    <div class="login-titulo">
        <h1>🐾 ClyvoVet</h1>
        <p class="subtitulo">Acompanhamento preventivo de pets</p>
    </div>

    <div class="painel">
        <div class="painel-corpo">

            <h2 class="titulo-cartao">Acessar o painel</h2>
            <div th:if="${param.erro}" class="aviso aviso-erro" role="alert">E-mail ou senha inválidos. Confira os dados e tente novamente.</div>
            <div th:if="${param.logout}" class="aviso aviso-ok" role="status">Sessão encerrada com sucesso.</div>

            <!-- th:action injeta o campo _csrf exigido pelo Spring Security.
                 Os names precisam ser username/password: é o que o
                 UsernamePasswordAuthenticationFilter lê por padrão. -->
            <form th:action="@{/login}" method="post">
                <div class="campo">
                    <label for="username">E-mail</label>
                    <input type="email" id="username" name="username"
                           placeholder="seu@email.com" required autofocus autocomplete="username" inputmode="email">
                </div>

                <div class="campo">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button class="btn" type="submit" style="width:100%">Entrar</button>
            </form>

        </div>
    </div>

    <footer th:replace="~{fragmentos :: rodape}"></footer>

</main>

</body>
</html>
