spring:
  application:
    name: clyvovet

  # Banco H2 em memoria para dev local.
  datasource:
    url: jdbc:h2:mem:clyvovetdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    # Quem cria o schema e o Flyway; o Hibernate apenas confere. Se uma
    # entidade divergir da migration, a aplicacao falha ao subir.
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  thymeleaf:
    cache: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

clyvovet:
  jwt:
    # Chave apenas de desenvolvimento/demonstracao. Em producao defina a
    # variavel de ambiente CLYVOVET_JWT_SECRET com uma chave propria.
    secret: ${CLYVOVET_JWT_SECRET:3ktdFCeznoWf+3hS0xCyRvp9RLw7QzZ17zz3f7zaZOM=}
    issuer: clyvovet-api
    expiration-minutes: 480

logging:
  level:
    org.flywaydb: INFO
